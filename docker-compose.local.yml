volumes:
  trashport_local_postgres_data: {}
  trashport_local_postgres_data_backups: {}
  

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: trashport_local_django
    container_name: trashport_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - '8001:8001'
    command: /start

  redis:
    image: redis:6-alpine
    container_name: trashport_local_redis
    ports:
      - "6379:6379"

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: trashport_production_postgres
    container_name: trashport_local_postgres
    ports:
      - "5432:5432"
    volumes:
      - trashport_local_postgres_data:/var/lib/postgresql/data
      - trashport_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
