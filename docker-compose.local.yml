# Alias to docker-compose.yml for local development
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trashport_django
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=trashport
      - POSTGRES_USER=debug
      - POSTGRES_PASSWORD=debug
      - DATABASE_URL=postgres://debug:debug@postgres:5432/trashport
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"

  postgres:
    image: postgres:16-alpine
    container_name: trashport_postgres
    environment:
      POSTGRES_DB: trashport
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: debug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug -d trashport"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: trashport_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
