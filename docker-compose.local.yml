volumes:
  trashport_local_postgres_data: {}
  trashport_local_postgres_data_backups: {}
  

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: trashport_local_django
    container_name: trashport_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql://debug:debug@postgres:5432/trashport
      - REDIS_URL=redis://redis:6379
    ports:
      - '127.0.0.1:8001:8001'
      - '127.0.0.1:8000:8001'
    command: /start

  redis:
    image: redis:8-alpine
    container_name: trashport_local_redis
    ports:
      - "6379:6379"

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: trashport_production_postgres
    container_name: trashport_local_postgres
    ports:
      - "5432:5432"
    volumes:
      - trashport_local_postgres_data:/var/lib/postgresql/data
      - trashport_local_postgres_data_backups:/backups
    env_file:
      - .env
