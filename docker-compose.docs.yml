services:
  docs:
    image: trashport_local_docs
    container_name: trashport_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - .env
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./trashport:/app/trashport:z
    ports:
      - '9000:9000'
    command: /start-docs
