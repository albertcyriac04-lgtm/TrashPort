services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trashport_django
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "${PORT:-80}:8001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8001"

  postgres:
    image: postgres:18-alpine
    container_name: trashport_postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: trashport
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: debug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug -d trashport"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trashport_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
