[project]
name = "trashport"
version = "0.1.0"
description = "On-Demand Smart Waste Collection System"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Albert Cyriac", email = "albertcyriac04@gmail.com" },
]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery>=5.4.0",
  "channels>=4.3.2",
  "channels-redis>=4.3.0",
  "crispy-bootstrap5==2026.9",
  "daphne>=4.2.3",
  "django==6.1.2",
  "django-allauth[mfa]==65.21.0",
  "django-anymail==15.2",
  "django-compressor==4.6.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "firebase-admin>=6.6.0",
  "google-auth-oauthlib>=1.4.0",
  "groq>=1.7.0",
  "gunicorn==26.2.0",
  "hiredis==3.5.0",
  "openai>=1.54.0",
  "pillow==13.0.0",
  "psycopg[binary]>=3.2.0",
  "python-slugify==9.1.3",
  "redis==8.1.0",
  "requests>=2.32.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.17.0",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djangorestframework-stubs==3.18.1",
  "djlint==1.47.1",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "psycopg[binary]>=3.2.0",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.3",
  "sphinx==9.1.1",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "slot"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
line-length = 120

lint.select = [
  "E",
  "F",
  "W",
  "I",
]
lint.ignore = [
  "E501",   # Line too long
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest.ini_options]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "8.0"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "trashport/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
