{% if messages %}
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
    {% for message in messages %}
      <div class="p-4 rounded-xl text-sm font-medium border {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200{% else %}bg-green-50 text-green-700 border-green-200{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
