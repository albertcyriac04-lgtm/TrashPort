<!-- Floating Chatbot Widget Partial -->
<div id="trashport-chat-widget">
  <!-- Chat Window -->
  <div id="chat-window" class="chat-window hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-brand-600 to-green-500 p-4 text-white flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 bg-green-300 rounded-full animate-ping"></div>
        <h4 class="font-bold text-sm">TrashPort AI Assistant</h4>
      </div>
    </div>

    <!-- Messages Body -->
    <div id="chat-messages-list" class="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3">
      <div class="flex justify-start">
        <div class="max-w-[85%] rounded-2xl rounded-tl-sm px-4 py-2.5 bg-gray-100 text-gray-800 text-sm">
          👋 Hi! How can I assist you with your waste pickups or recycling today?
        </div>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chat-input-form" class="p-3 border-t border-gray-100 flex gap-2">
      <input type="text" id="chat-message-input" placeholder="Ask a question or book pickup..." class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      <button type="submit" class="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold transition">
        ➤
      </button>
    </form>
  </div>

  <!-- Toggle Button -->
  <button id="chat-toggle-btn" class="chat-bubble">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
    </svg>
  </button>
</div>
