<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TrashPort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 flex items-center justify-center min-h-screen p-4 selection:bg-brand-500 selection:text-white">

    <div class="max-w-md w-full bg-white rounded-2xl border border-gray-100 shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Top accent line -->
        <div class="h-2 bg-gradient-to-r from-brand-500 to-green-400 absolute top-0 left-0 right-0"></div>

        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-brand-500 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/30 mx-auto mb-4 cursor-pointer" onclick="window.location.href='{% url 'home' %}'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-dark tracking-tight">Welcome Back</h1>
            <p class="text-sm text-gray-500 mt-2">Sign in to manage your smart waste logistics</p>
        </div>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r-lg"></div>

        <!-- Google Sign-In Button -->
        <button type="button" onclick="handleGoogleLogin()" class="w-full py-3 border border-gray-200 rounded-xl font-semibold text-gray-700 hover:bg-gray-50 hover:border-gray-300 transition-all flex items-center justify-center gap-2 mb-6">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <!-- Divider -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-150"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-3 text-gray-400 font-semibold tracking-wider">Or with Email</span></div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
                <input type="email" id="email" required placeholder="name@company.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all" />
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all" />
            </div>

            <button type="submit" class="w-full py-3.5 bg-brand-600 text-white font-semibold rounded-xl hover:bg-brand-700 transition-colors shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2">
                Sign In
            </button>
        </form>

        <!-- Signup Link -->
        <p class="text-center text-sm text-gray-500 mt-8">
            New to TrashPort? 
            <a href="{% url 'account_signup' %}" class="text-brand-600 hover:text-brand-700 font-semibold hover:underline">Create an account</a>
        </p>

    </div>

    <!-- Firebase SDK Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // CLIENT FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "{{ FIREBASE_WEB_API_KEY }}",
            authDomain: "trashport-fcb21.firebaseapp.com",
            projectId: "trashport-fcb21",
            storageBucket: "trashport-fcb21.appspot.com",
        };

        // Initialize Firebase
        let firebaseInitialized = false;
        try {
            firebase.initializeApp(firebaseConfig);
            firebaseInitialized = true;
        } catch (e) {
            console.error("Firebase failed to initialize on client.", e);
        }

        const form = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');

        const showError = (msg) => {
            errorAlert.textContent = msg;
            errorAlert.classList.remove('hidden');
        };

        // Handle POST to backend view
        const sendTokenToBackend = async (token) => {
            try {
                const response = await fetch("{% url 'users:firebase_login' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ token: token })
                });
                const result = await response.json();
                if (result.status === "success") {
                    window.location.href = result.redirect_url;
                } else {
                    showError(result.message || "Failed to log in on server.");
                }
            } catch (err) {
                showError("Connection error to server: " + err.message);
            }
        };

        // Handle POST to backend for direct password authentication
        const sendCredentialsToBackend = async (email, password) => {
            try {
                const response = await fetch("{% url 'users:password_login' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email: email, password: password })
                });
                const result = await response.json();
                if (result.status === "success") {
                    window.location.href = result.redirect_url;
                } else {
                    showError(result.message || "Invalid email or password.");
                }
            } catch (err) {
                showError("Connection error to server: " + err.message);
            }
        };

        // Form Submit handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // 1. Try Firebase client authentication first if initialized
            if (firebaseInitialized) {
                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    const token = await userCredential.user.getIdToken();
                    await sendTokenToBackend(token);
                    return;
                } catch (err) {
                    console.warn("Firebase sign-in failed, trying database authentication fallback:", err.code);
                }
            }

            // 2. Fallback to Django database authentication
            await sendCredentialsToBackend(email, password);
        });

        // Google Login Handler
        const handleGoogleLogin = async () => {
            errorAlert.classList.add('hidden');
            if (!firebaseInitialized) {
                showError("Firebase is not initialized. Please verify configuration.");
                return;
            }

            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                const token = await result.user.getIdToken();
                await sendTokenToBackend(token);
            } catch (err) {
                showError("Google Sign-In failed: " + err.message);
            }
        };
    </script>
</body>
</html>
