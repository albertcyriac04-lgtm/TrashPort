<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | TrashPort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl border border-gray-100 shadow-2xl p-8 text-center relative overflow-hidden">

        <!-- Top accent line -->
        <div class="h-2 bg-gradient-to-r from-brand-500 to-green-400 absolute top-0 left-0 right-0"></div>

        <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>

        <h1 class="text-2xl font-extrabold text-dark tracking-tight mb-3">Check Your Email</h1>

        <p class="text-gray-600 text-sm leading-relaxed mb-8">
            We have sent you an email with instructions to reset your password. Please check your inbox (and spam folder) and follow the link provided.
        </p>

        <div class="space-y-3">
            <a href="{% url 'account_login' %}"
                class="block w-full py-3.5 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 shadow-lg shadow-brand-500/20 transition-all">
                Return to Sign In
            </a>

            <a href="{% url 'account_reset_password' %}"
                class="block w-full py-3 border border-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-all text-sm">
                Didn't receive the email? Try again
            </a>
        </div>
    </div>

</body>
</html>
