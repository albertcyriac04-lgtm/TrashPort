{% extends "base.html" %}
{% block title %}User Profile | TrashPort{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 mb-6">
        <div class="flex items-center gap-6">
            <div class="w-20 h-20 rounded-2xl bg-brand-500 text-white flex items-center justify-center text-3xl font-bold shadow-lg shadow-brand-500/20">
                {{ user.name|default:user.email|slice:":1"|upper }}
            </div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900">{{ user.name|default:"TrashPort Member" }}</h1>
                <p class="text-gray-500 text-sm">{{ user.email }}</p>
                <div class="mt-2 flex gap-2">
                    <span class="px-3 py-1 bg-green-50 text-green-700 text-xs font-semibold rounded-full border border-green-200">
                        {{ user.role }}
                    </span>
                    <span class="px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-full border border-emerald-200">
                        🌟 {{ user.wallet_points|default:0 }} Green Points
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
